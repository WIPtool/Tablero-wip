<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Tablero WIP</title>
  <link rel="icon" href="/favicon.png">
  <link rel="preload" href="/fonts/satoshi-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    /* Tema guardado antes de pintar, para que no parpadee. */
    try { var t = localStorage.getItem('tablero_tema'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
